[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentend"
version = "0.1.0"
description = "Python single-agent workflow runtime with CLI, Telegram, SQLite, and MCP client support."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2",
  "PyYAML>=6",
  "SQLAlchemy>=2",
  "typer>=0.12",
  "python-telegram-bot>=21",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[project.scripts]
agentend = "agentend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
